# 本地开发配置（宿主机 go run 或 docker-compose.dev.yml）
# 复制：cp config.local.example.yaml config.local.yaml
# redis.password 须与本机 Redis requirepass 一致

server:
  addr: ":8080"
  debug: true

database:
  dsn: "postgres://seedao:seedao@127.0.0.1:5432/seedao_api?sslmode=disable"

redis:
  addr: "127.0.0.1:6379"
  password: "CHANGE_ME_REDIS_PASSWORD"
  db: 0

jwt:
  secret: "local-dev-secret-change-me"
  exp_hours: 168

aliyun_sms:
  access_key_id: ""
  access_key_secret: ""
  sign_name: "SeeDAO"
  template_code: "SMS_XXXXXX"
  dev_mode: true

siwe:
  chain_id: 1

membership:
  membership_price_fen: 3500
  order_expire_minutes: 30
  description: "SEEDAO 年度会员"

wechat_pay:
  dev_mode: true
  mch_id: ""
  app_id: ""
  api_v3_key: ""
  cert_serial_no: ""
  private_key_path: ""
  wechat_public_key_id: ""
  wechat_public_key_path: ""
  notify_url: "https://your-api.example.com/v1/payments/wechat/notify"
  h5_wap_name: "SeeDAO"
  h5_wap_url: "https://seedao.xyz"
  h5_return_url: "https://seedao.xyz/pay/result"

alipay:
  dev_mode: true
  app_id: ""
  private_key_path: ""
  alipay_public_key_path: ""
  notify_url: "https://your-api.example.com/v1/payments/alipay/notify"
  return_url: "https://seedao.xyz/pay/result"
  quit_url: "https://seedao.xyz/pay/cancel"

# governance：生产名单仅配在 ECS config.prod.yaml；本地联调可自建 governance 段（勿提交真实名单）
governance:
  quarter_node_total: 13
  hall_proposal_sns:
    - your_sns.seedao
  node_consensus_proposal_sns:
    - your_sns.seedao
  hall_voter_sns: []
  node_voter_sns: []
  default_publicity_seconds: 432000
  default_vote_duration_seconds: 172800

feishu:
  app_id: "cli_xxxxxxxx"
  bind_token_ttl_seconds: 600
  bind_code_ttl_seconds: 600
  bind_url_template: "https://www.seedao.xyz/profile/bind?token={token}"

internal:
  service_token: "local-dev-service-token-change-me"
