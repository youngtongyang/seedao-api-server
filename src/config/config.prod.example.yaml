# 生产环境配置（docker-compose.prod.yml）
# ECS：复制到 服务器上的生产配置文件（不在本仓库）
# 模板：cp config.prod.example.yaml 服务器上的生产配置文件（不在本仓库）
# 生产环境务必填写真实密钥，且 dev_mode 设为 false

server:
  addr: ":8080"
  debug: false

database:
  # 方式 A：PostgreSQL 在宿主机（配合 docker-compose.prod.host.yml）
  dsn: "postgres://seedao:CHANGE_ME@host.docker.internal:5432/seedao_api?sslmode=disable"
  # 方式 B：阿里云 RDS 等外部地址
  # dsn: "postgres://seedao:CHANGE_ME@rm-xxx.pg.rds.aliyuncs.com:5432/seedao_api?sslmode=disable"

redis:
  # 方式 A：Redis 在宿主机（配合 docker-compose.prod.host.yml）
  addr: "host.docker.internal:6379"
  # 方式 B：Redis 在 compose 容器内（配合 docker-compose.prod.yml）
  # addr: "redis:6379"
  password: "CHANGE_ME_REDIS_PASSWORD"
  db: 0

jwt:
  secret: "CHANGE_ME_USE_STRONG_RANDOM_SECRET"
  exp_hours: 168

aliyun_sms:
  access_key_id: "your-prod-access-key-id"
  access_key_secret: "your-prod-access-key-secret"
  sign_name: "SeeDAO"
  template_code: "SMS_XXXXXX"
  dev_mode: false

siwe:
  chain_id: 1

wechat_pay:
  dev_mode: false
  mch_id: "your-mch-id"
  app_id: "wxXXXXXXXX"
  api_v3_key: "your-32-char-apiv3-key"
  cert_serial_no: "your-cert-serial-no"
  private_key_path: "/app/certs/apiclient_key.pem"
  wechat_public_key_id: "PUB_KEY_ID_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  wechat_public_key_path: "/app/certs/pub_key.pem"
  notify_url: "https://api.seedao.xyz/v1/payments/wechat/notify"
  h5_wap_name: "SeeDAO"
  h5_wap_url: "https://seedao.xyz"
  h5_return_url: "https://seedao.xyz/pay/result"
  membership_price_fen: 9900
  order_expire_minutes: 15
  description: "SeeDAO 会员续费"

alipay:
  dev_mode: false
  app_id: "your-alipay-app-id"
  private_key_path: "/app/certs/alipay_app_private_key.pem"
  alipay_public_key_path: "/app/certs/alipay_public_key.pem"
  notify_url: "https://api.seedao.xyz/v1/payments/alipay/notify"
  return_url: "https://seedao.xyz/pay/result"
  quit_url: "https://seedao.xyz/pay/cancel"

# governance 白名单仅写在 ECS config.prod.yaml，勿提交 Git（见 docs/OPERATIONS.md）
