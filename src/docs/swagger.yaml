host: api.seedao.xyz
info:
  contact: {}
  description: SeeDAO 后端 API（认证、支付、课程、治理提案等）
  title: SeeDAO API Server
  version: "2.7"
paths:
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 健康检查
      tags:
      - health
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 手机号登录
      tags:
      - auth
  /v1/auth/phone/check:
    get:
      parameters:
      - description: E.164 手机号
        in: query
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 检查手机号是否可注册
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 注册（新 SNS / 认领存量 SNS）
      tags:
      - auth
  /v1/auth/sms/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: 手机号
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sendSMSRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 发送短信验证码
      tags:
      - auth
  /v1/courses/checkout/preview:
    post:
      consumes:
      - application/json
      parameters:
      - description: 试算参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.courseCheckoutPreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 课程价格试算
      tags:
      - courses
  /v1/courses/dev/orders/{order_no}/simulate-pay:
    post:
      consumes:
      - application/json
      parameters:
      - description: 订单号
        in: path
        name: order_no
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 模拟课程支付（仅 dev_mode）
      tags:
      - courses
  /v1/courses/orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: 下单
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createCourseOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 创建课程订单
      tags:
      - courses
  /v1/courses/orders/{order_no}:
    get:
      parameters:
      - description: 订单号
        in: path
        name: order_no
        required: true
        type: string
      - description: 匿名订单 token
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 查询课程订单
      tags:
      - courses
  /v1/courses/orders/{order_no}/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: 订单号
        in: path
        name: order_no
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 关闭课程订单
      tags:
      - courses
  /v1/courses/orders/claim:
    post:
      consumes:
      - application/json
      parameters:
      - description: 认领
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.claimCourseOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 认领匿名课程订单
      tags:
      - courses
  /v1/governance/nodes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.GovernanceNodesResult'
              type: object
      summary: 获取治理节点白名单配置
      tags:
      - governance
  /v1/payments/coupons/preview:
    post:
      consumes:
      - application/json
      parameters:
      - description: 券码试算
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.previewCouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 会员续费优惠券试算
      tags:
      - payments
  /v1/payments/dev/simulate-pay:
    post:
      consumes:
      - application/json
      parameters:
      - description: 订单号
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.simulatePayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 模拟支付（仅 dev_mode）
      tags:
      - payments
  /v1/payments/orders:
    get:
      parameters:
      - description: 条数，默认 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 支付订单列表
      tags:
      - payments
    post:
      consumes:
      - application/json
      parameters:
      - description: 下单
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createPaymentOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 创建支付订单（会员续费）
      tags:
      - payments
  /v1/payments/orders/{order_no}:
    get:
      parameters:
      - description: 订单号
        in: path
        name: order_no
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 查询支付订单
      tags:
      - payments
  /v1/payments/orders/{order_no}/close:
    post:
      parameters:
      - description: 订单号
        in: path
        name: order_no
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 关闭未支付订单
      tags:
      - payments
  /v1/payments/wechat/notify:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 微信支付回调（微信服务器调用）
      tags:
      - payments
  /v1/proposals:
    get:
      parameters:
      - description: 每页条数，默认 20，最大 50
        in: query
        name: limit
        type: integer
      - description: 游标：返回 id 小于此值的记录
        in: query
        name: before_id
        type: integer
      - description: 提案类型
        in: query
        name: type
        type: string
      - description: 提案状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.ProposalListResult'
              type: object
      summary: 分页获取提案列表
      tags:
      - proposals
    post:
      consumes:
      - application/json
      parameters:
      - description: 提案内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.ProposalResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      security:
      - BearerAuth: []
      summary: 创建提案草稿
      tags:
      - proposals
  /v1/proposals/{id}:
    get:
      parameters:
      - description: 提案 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 是否包含投票列表
        in: query
        name: include_votes
        type: boolean
      - description: 是否包含评论列表
        in: query
        name: include_comments
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.ProposalDetail'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 获取提案详情
      tags:
      - proposals
    patch:
      consumes:
      - application/json
      parameters:
      - description: 提案 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新字段
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.ProposalResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 修改提案草稿
      tags:
      - proposals
  /v1/proposals/{id}/close:
    post:
      parameters:
      - description: 提案 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_service.ProposalResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 关闭提案草稿
      tags:
      - proposals
  /v1/proposals/{id}/comments:
    get:
      parameters:
      - description: 提案 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 条数上限
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_seedao_seedao-api-server_internal_pkg_response.Envelope'
      summary: 获取提案评论列表
      tags:
      - proposals
    post:
      consumes:
      - application/json
      parameters:
      - description: 提案 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createCommentRequest'
      produces:
      - application/json
